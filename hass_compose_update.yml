version: '3'
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - /home/pirate/docker/hass/config:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    network_mode: host

  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper
    command: --model base --language es
    volumes:
      - /home/pirate/docker/hass/whisper-data:/data
    restart: unless-stopped
    network_mode: host

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper
    command: --voice es_ES-sharvard-medium
    volumes:
      - /home/pirate/docker/hass/piper-data:/data
    restart: unless-stopped
    network_mode: host

  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword
    command: --preload-model 'okay_nabu' --preload-model 'hey_jarvis' --threshold 0.15 --debug --debug-probability
    restart: unless-stopped
    network_mode: host

  # Satellite replaced by modern linux-voice-assistant (ESPHome protocol) in /home/pirate/docker/linux-voice-assistant
  mpd:
    container_name: mpd
    build:
      context: .
      dockerfile: Dockerfile.mpd
    restart: unless-stopped
    network_mode: host
    environment:
      - PULSE_SERVER=unix:/run/user/1001/pulse/native
      - PULSE_COOKIE=/root/.config/pulse/cookie
    volumes:
      - /run/user/1001/pulse:/run/user/1001/pulse
      - /home/pirate/.config/pulse/cookie:/root/.config/pulse/cookie:ro
      - /home/pirate/docker/synapse-ia/mpd.conf:/etc/mpd.conf:ro
    command: mpd --no-daemon --stdout /etc/mpd.conf

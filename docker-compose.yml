version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: synapse-ia-db
    environment:
      POSTGRES_DB: synapse_ia
      POSTGRES_USER: arconte
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  athena:
    build: .
    container_name: synapse-ia-nexus
    ports:
      - "5050:5050"
    command: [ "./entrypoint.sh" ]
    # depends_on:
    #   - db
    volumes:
      - .:/app
    environment:
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgresql://arconte:${DB_PASSWORD}@192.168.1.75:5432/synapse_ia
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: synapse-ia_postgres_data

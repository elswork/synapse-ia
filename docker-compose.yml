version: '3.8'

services:
  athena:
    build: .
    container_name: synapse-ia-nexus
    volumes:
      - .:/app
      - ./context/synapse_memory.db:/app/context/synapse_memory.db
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped
    # Si en el futuro tenemos una DB o el servidor MCP dedicado

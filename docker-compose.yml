version: '3.4'

services:
  db:
    image: postgres:15-alpine
    container_name: synapse-ia-db
    environment:
      POSTGRES_DB: synapse_ia
      POSTGRES_USER: arconte
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - synapse-ia_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  athena:
    build: .
    container_name: synapse-ia-nexus
    ports:
      - "5050:5050"
    command: [ "./entrypoint.sh" ]
    volumes:
      - .:/app
    environment:
      - BASE_PATH=/app
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgresql://arconte:${DB_PASSWORD}@synapse-ia-db:5432/synapse_ia
    env_file:
      - .env
    stdin_open: true
    tty: true
    restart: unless-stopped

  archimedes-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    container_name: archimedes-telegram-bridge
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - BASE_PATH=/app
      - PYTHONPATH=/app
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgresql://arconte:${DB_PASSWORD}@synapse-ia-db:5432/synapse_ia
    restart: always

  m2-api:
    image: python:3.9-slim
    container_name: m2-status-api
    privileged: true
    network_mode: host
    volumes:
      - ./tools:/app/tools
      - /sys:/sys
      - /proc:/proc
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    command: sh -c "apt-get update && apt-get install -y procps pulseaudio-utils && pip install flask flask-cors psutil docker && python3 tools/m2_status_api.py"
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: synapse-ia-adminer
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  synapse-ia_postgres_data:
    external: true

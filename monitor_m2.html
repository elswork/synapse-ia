<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2 Touch Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #00d4ff;
            --text: #e6edf3;
            --danger: #ff4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 1280px;
            height: 800px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            display: flex;
            flex-direction: column;
        }

        /* Screensaver styles */
        /* Screensaver styles */
        #screensaver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #screensaver.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #saver_time {
            font-size: 14rem;
            /* Masivo */
            font-weight: 700;
            color: #fff;
            margin: 0;
            line-height: 0.9;
        }

        #saver_date {
            font-size: 4rem;
            /* Mucho más grande */
            color: #888;
            margin-top: 20px;
            font-weight: 300;
            text-align: center;
        }

        #saver_weather {
            margin-top: 60px;
            display: flex;
            align-items: center;
            gap: 40px;
        }

        #saver_temp {
            font-size: 7rem;
            color: var(--accent);
            font-weight: 600;
        }

        #saver_icon {
            font-size: 7rem;
        }

        #saver_loc {
            font-size: 2rem;
            color: #555;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 17, 23, 0.8);
            border-bottom: 2px solid var(--accent);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin: 0;
            color: var(--accent);
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.98);
            background: #161b22;
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 600;
            margin: 5px 0;
        }

        .stat-label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
        }

        .footer {
            padding: 15px;
            text-align: center;
            background: #0d1117;
            border-top: 1px solid #30363d;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>
    <!-- Screensaver Overlay -->
    <div id="screensaver" onclick="dismissScreensaver()">
        <div id="saver_time">--:--</div>
        <div id="saver_date">-- -- --</div>
        <div id="saver_weather">
            <div id="saver_icon">🌤️</div>
            <div id="saver_temp">--°</div>
        </div>
        <div id="saver_loc">Alcorcón, ES</div>
    </div>

    <div class="header">
        <h1>ANTICITERA NEXUS M2</h1>
        <div id="clock" style="font-size: 2rem; font-weight: 600;"></div>
    </div>

    <div class="main">
        <div class="card" onclick="location.reload()">
            <div class="stat-label">⚡ CPU LOAD</div>
            <div class="stat-value" id="cpu_val">--%</div>
        </div>
        <div class="card">
            <div class="stat-label">🧠 RAM USAGE</div>
            <div class="stat-value" id="ram_val">--%</div>
        </div>
        <div class="card">
            <div class="stat-label">🛰️ REPLICATION</div>
            <div class="stat-value" id="sync_status" style="color: #0f0;">ONLINE</div>
        </div>
        <div class="card">
            <div class="stat-label">🦉 NODES STATUS</div>
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <div style="text-align:center;">
                    <div style="color:#0f0; font-size:1.5rem;">●</div> M2
                </div>
                <div style="text-align:center;">
                    <div id="hc1_dot" style="color:#0f0; font-size:1.5rem;">●</div> HC1
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="fetchStats()">ACTUALIZAR</button>
        <button class="btn" style="background:#555; color:#fff;" onclick="activateScreensaver()">REPOSO</button>
    </div>

    <script>
        let idleTime = 0;
        const IDLE_LIMIT = 300; // 5 minutos (300 segundos)
        let isDimmed = false;
        const screensaver = document.getElementById('screensaver');

        async function setBrightness(percent) {
            try {
                await fetch('http://localhost:5051/brightness', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ percent })
                });
            } catch (e) {
                console.error("Error ajustando brillo:", e);
            }
        }

        // Configurar interacción
        function dismissScreensaver() {
            screensaver.classList.add('hidden');
            idleTime = 0;
            if (isDimmed) {
                setBrightness(100);
                isDimmed = false;
            }
        }

        function activateScreensaver() {
            screensaver.classList.remove('hidden');
            fetchWeather(); // Actualizar tiempo al activar
            if (!isDimmed) {
                setBrightness(25);
                isDimmed = true;
            }
        }

        // Detector de inactividad
        setInterval(() => {
            idleTime++;
            if (idleTime >= IDLE_LIMIT) {
                if (screensaver.classList.contains('hidden')) {
                    activateScreensaver();
                }
            }
        }, 1000);

        // Reset inactividad con cualquier toque
        document.body.addEventListener('click', () => { dismissScreensaver(); });
        document.body.addEventListener('touchstart', () => { dismissScreensaver(); });

        // Reloj y Fecha del Screensaver
        function updateTime() {
            const now = new Date();
            // Reloj Dashboard
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // Reloj Screensaver
            document.getElementById('saver_time').innerText = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('es-ES', options);
            document.getElementById('saver_date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }

        // Clima (Open-Meteo)
        async function fetchWeather() {
            try {
                // Alcorcón coords: 40.3458, -3.8249
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.3458&longitude=-3.8249&current=temperature_2m,weather_code&timezone=Europe%2FMadrid');
                const data = await res.json();

                const temp = Math.round(data.current.temperature_2m);
                const code = data.current.weather_code;

                // Mapeo simple de códigos WMO a emojis
                let icon = '❓';
                if (code === 0) icon = '☀️';
                else if (code >= 1 && code <= 3) icon = '⛅';
                else if (code >= 45 && code <= 48) icon = '🌫️';
                else if (code >= 51 && code <= 67) icon = '🌧️';
                else if (code >= 71 && code <= 77) icon = '❄️';
                else if (code >= 80 && code <= 82) icon = '🌦️';
                else if (code >= 95) icon = '⚡';

                document.getElementById('saver_temp').innerText = temp + '°C';
                document.getElementById('saver_icon').innerText = icon;

            } catch (e) {
                console.error("Weather error:", e);
            }
        }

        async function fetchStats() {
            try {
                // Ahora consultamos la API que corre en el HOST
                const response = await fetch('http://localhost:5051/stats');
                const data = await response.json();
                document.getElementById('cpu_val').innerText = Math.round(data.cpu) + '%';
                document.getElementById('ram_val').innerText = Math.round(data.ram) + '%';
                document.getElementById('cpu_val').style.color = 'var(--text)';
            } catch (e) {
                console.error("Error fetching stats:", e);
                document.getElementById('cpu_val').style.color = 'var(--danger)';
            }
        }

        setInterval(updateTime, 1000);
        setInterval(fetchStats, 2000);
        setInterval(fetchWeather, 600000); // Clima cada 10 mins

        updateTime();
        fetchStats();
        fetchWeather();
    </script>
</body>

</html>

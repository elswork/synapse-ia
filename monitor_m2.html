<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2 Touch Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #00d4ff;
            --text: #e6edf3;
            --danger: #ff4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 1280px;
            height: 800px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 17, 23, 0.8);
            border-bottom: 2px solid var(--accent);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin: 0;
            color: var(--accent);
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.98);
            background: #161b22;
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 600;
            margin: 5px 0;
        }

        .stat-label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
        }

        .footer {
            padding: 15px;
            text-align: center;
            background: #0d1117;
            border-top: 1px solid #30363d;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>ANTICITERA NEXUS M2</h1>
        <div id="clock" style="font-size: 2rem; font-weight: 600;"></div>
    </div>

    <div class="main">
        <div class="card" onclick="location.reload()">
            <div class="stat-label">⚡ CPU LOAD</div>
            <div class="stat-value" id="cpu_val">--%</div>
        </div>
        <div class="card">
            <div class="stat-label">🧠 RAM USAGE</div>
            <div class="stat-value" id="ram_val">--%</div>
        </div>
        <div class="card">
            <div class="stat-label">🛰️ REPLICATION</div>
            <div class="stat-value" id="sync_status" style="color: #0f0;">ONLINE</div>
        </div>
        <div class="card">
            <div class="stat-label">🦉 NODES STATUS</div>
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <div style="text-align:center;">
                    <div style="color:#0f0; font-size:1.5rem;">●</div> M2
                </div>
                <div style="text-align:center;">
                    <div id="hc1_dot" style="color:#0f0; font-size:1.5rem;">●</div> HC1
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="fetchStats()">ACTUALIZAR</button>
        <button class="btn" style="background:#555; color:#fff;" onclick="window.history.back()">VOLVER</button>
    </div>

    <script>
        async function fetchStats() {
            try {
                // Ahora consultamos la API que corre en el HOST
                const response = await fetch('http://localhost:5051/stats');
                const data = await response.json();
                document.getElementById('cpu_val').innerText = Math.round(data.cpu) + '%';
                document.getElementById('ram_val').innerText = Math.round(data.ram) + '%';
                document.getElementById('cpu_val').style.color = 'var(--text)';
            } catch (e) {
                console.error("Error fetching stats:", e);
                document.getElementById('cpu_val').style.color = 'var(--danger)';
            }
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        setInterval(fetchStats, 2000);
        fetchStats();
    </script>
</body>

</html>

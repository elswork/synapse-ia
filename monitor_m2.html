<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2 Touch Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #00d4ff;
            --text: #e6edf3;
            --danger: #ff4444;
            --success: #2ea043;
            --warning: #d29922;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 1280px;
            height: 800px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            display: flex;
            flex-direction: column;
        }

        /* Screensaver */
        #screensaver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #screensaver.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #saver_time {
            font-size: 14rem;
            font-weight: 700;
            color: #fff;
            margin: 0;
            line-height: 0.9;
        }

        #saver_date {
            font-size: 4rem;
            color: #888;
            margin-top: 20px;
            font-weight: 300;
        }

        #saver_weather {
            margin-top: 60px;
            display: flex;
            align-items: center;
            gap: 40px;
            cursor: pointer;
        }

        #saver_temp {
            font-size: 7rem;
            color: var(--accent);
            font-weight: 600;
        }

        #saver_icon {
            font-size: 7rem;
        }

        #saver_loc {
            font-size: 2rem;
            color: #555;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Weather Modal */
        #weather_modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: 60px;
            box-sizing: border-box;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #weather_modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: auto;
        }

        .weather-info h2 {
            font-size: 4rem;
            margin: 0;
            font-weight: 600;
        }

        .weather-meta {
            font-size: 2rem;
            margin-top: 20px;
            opacity: 0.9;
            display: flex;
            gap: 40px;
        }

        .weather-current-temp {
            font-size: 12rem;
            font-weight: 300;
            line-height: 1;
        }

        .hourly-container {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .hourly-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .hourly-temp {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .hourly-icon {
            font-size: 4rem;
        }

        .hourly-time {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        /* Music Modal */
        #music_modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0d1117;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #music_modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .music-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            flex: 1;
            margin-top: 20px;
            overflow-y: auto;
        }

        .genre-card {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            padding: 20px;
        }

        .genre-card:active {
            transform: scale(0.95);
            background: #21262d;
            border-color: var(--accent);
        }

        .genre-icon {
            font-size: 4rem;
            margin-bottom: 10px;
        }

        .genre-name {
            font-size: 1.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        .station-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            display: none;
            flex: 1;
            overflow-y: auto;
        }

        .station-item {
            background: #161b22;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.5rem;
            border: 1px solid #30363d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .station-item:active,
        .station-item.playing {
            background: #1f242c;
            border-color: var(--success);
            color: var(--success);
        }

        /* Player Controls */
        #now_playing {
            background: #161b22;
            padding: 20px;
            border-top: 2px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            bottom: 0;
            /* Reset to absolute bottom */
            left: 0;
            width: 100%;
            box-sizing: border-box;
            transform: translateY(100%);
            /* Hidden below screen */
            transition: transform 0.3s ease-in-out;
            z-index: 3000;
        }

        #now_playing.visible {
            transform: translateY(0);
        }

        .np-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .np-controls {
            display: flex;
            gap: 20px;
        }

        .btn-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent);
            color: black;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Layout */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            background: rgba(13, 17, 23, 0.9);
            border-bottom: 2px solid var(--accent);
            height: 100px;
            box-sizing: border-box;
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            margin: 0;
            color: var(--accent);
            flex: 1;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            flex: 2;
            justify-content: center;
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            /* Adjusted for node content */
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .node-name {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .node-status {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        .node-status.online {
            background: var(--success);
            box-shadow: 0 0 10px var(--success);
        }

        .node-status.offline {
            background: var(--danger);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin: 5px 0;
        }

        .stat-label {
            font-size: 1.2rem;
            color: #888;
        }

        .stat-val {
            font-size: 2rem;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: #30363d;
            border-radius: 4px;
            margin-top: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.5s ease;
        }

        .footer {
            padding: 15px;
            text-align: center;
            background: #0d1117;
            border-top: 1px solid #30363d;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-music {
            background: #238636;
            color: white;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-close {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            font-size: 2rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }
    </style>
</head>

<body>
    <!-- Screensaver -->
    <div id="screensaver" onclick="dismissScreensaver(event)">
        <div id="saver_time">--:--</div>
        <div id="saver_date">-- -- --</div>
        <div id="saver_weather" onclick="showWeatherModal(event)">
            <div id="saver_icon">🌤️</div>
            <div id="saver_temp">--°</div>
            <div style="font-size:1.5rem; color:#888;">(Detalles)</div>
        </div>
        <div id="saver_loc">Alcorcón, ES</div>
    </div>

    <!-- Weather Modal -->
    <div id="weather_modal" onclick="closeWeatherModal(event)">
        <button class="btn-close" onclick="closeWeatherModal(event)">✕</button>
        <div class="weather-main">
            <div class="weather-info">
                <h2 id="w_desc">Cargando...</h2>
                <div class="weather-meta">
                    <span>Alcorcón</span>
                    <span id="w_hl">↑ --° ↓ --°</span>
                    <span id="w_rain">☔ --%</span>
                </div>
            </div>
            <div class="weather-current-temp" id="w_current">--°</div>
        </div>
        <div class="hourly-container" id="hourly_strip"></div>
    </div>

    <!-- Music Modal -->
    <div id="music_modal">
        <button class="btn-close" style="background: rgba(255,0,0,0.3);" onclick="closeMusicModal()">✕</button>
        <h2 style="font-size: 3rem; margin-top:0;">Música & Radio</h2>
        <div class="music-grid" id="genre_view">
            <!-- Populated via JS -->
        </div>
        <div class="station-list" id="station_view">
            <button class="btn" style="align-self: flex-start; margin-bottom: 20px;" onclick="showGenres()">←
                Volver</button>
            <div id="stations_container" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
    </div>

    <!-- Now Playing -->
    <div id="now_playing">
        <div class="np-info">
            <div style="font-size: 2rem;">🎵</div>
            <div>
                <div style="color: var(--accent); font-size: 0.9rem;">REPRODUCIENDO</div>
                <div id="np_name" style="font-weight: 600; font-size: 1.2rem;">Nada sonando</div>
            </div>
        </div>
        <div class="np-controls">
            <button class="btn-circle" onclick="togglePlay()" id="play_btn">▶</button>
            <button class="btn-circle" style="background: #333; color: white;" onclick="stopMusic()">⏹</button>
        </div>
    </div>

    <div class="header">
        <h1>ANTICITERA NEXUS BOARD</h1>
        <div class="header-controls">
            <button class="btn-music" onclick="openMusicModal()">🎵 MÚSICA</button>
            <button class="btn" onclick="updateAllNodes()">ACTUALIZAR</button>
            <button class="btn" style="background:#555; color:#fff;" onclick="activateScreensaver()">REPOSO</button>
        </div>
        <div id="clock" style="font-size: 2rem; font-weight: 600; flex: 1; text-align: right;"></div>
    </div>

    <!-- MAIN GRID: 4 Nodes -->
    <div class="main">
        <!-- NODE M2 -->
        <div class="card" id="node_m2">
            <div class="node-header">
                <div class="node-name">NODO M2</div>
                <div class="node-status" id="status_m2"></div>
            </div>
            <div>
                <div class="stat-row">
                    <span class="stat-label">CPU</span>
                    <span class="stat-val" id="cpu_m2">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_cpu_m2"></div>
                </div>

                <div style="height: 15px;"></div>

                <div class="stat-row">
                    <span class="stat-label">RAM</span>
                    <span class="stat-val" id="ram_m2">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_ram_m2"></div>
                </div>
            </div>
        </div>

        <!-- NODE LEGION -->
        <div class="card" id="node_legion">
            <div class="node-header">
                <div class="node-name">NODO LEGION</div>
                <div class="node-status" id="status_legion"></div>
            </div>
            <div>
                <div class="stat-row">
                    <span class="stat-label">CPU</span>
                    <span class="stat-val" id="cpu_legion">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_cpu_legion"></div>
                </div>

                <div style="height: 15px;"></div>

                <div class="stat-row">
                    <span class="stat-label">RAM</span>
                    <span class="stat-val" id="ram_legion">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_ram_legion"></div>
                </div>
            </div>
        </div>

        <!-- NODE CHROMEBOOK -->
        <div class="card" id="node_chromebook">
            <div class="node-header">
                <div class="node-name">CHROMEBOOK</div>
                <div class="node-status" id="status_chromebook"></div>
            </div>
            <div>
                <div class="stat-row">
                    <span class="stat-label">CPU</span>
                    <span class="stat-val" id="cpu_chromebook">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_cpu_chromebook"></div>
                </div>

                <div style="height: 15px;"></div>

                <div class="stat-row">
                    <span class="stat-label">RAM</span>
                    <span class="stat-val" id="ram_chromebook">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_ram_chromebook"></div>
                </div>
            </div>
        </div>

        <!-- NODE HC1 -->
        <div class="card" id="node_hc1">
            <div class="node-header">
                <div class="node-name">NODO HC1</div>
                <div class="node-status" id="status_hc1"></div>
            </div>
            <div>
                <div class="stat-row">
                    <span class="stat-label">CPU</span>
                    <span class="stat-val" id="cpu_hc1">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_cpu_hc1"></div>
                </div>

                <div style="height: 15px;"></div>

                <div class="stat-row">
                    <span class="stat-label">RAM</span>
                    <span class="stat-val" id="ram_hc1">--%</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="bar_ram_hc1"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Removed -->

    <!-- Audio Element -->
    <audio id="audio_player" preload="none"></audio>

    <script>
        // CONFIG
        const NODES = {
            m2: 'http://192.168.1.75:5051/stats',
            legion: 'http://192.168.1.34:5051/stats',
            chromebook: 'http://192.168.1.86:5051/stats',
            hc1: 'http://192.168.1.27:5051/stats'
        };

        let idleTime = 0;
        const IDLE_LIMIT = 300;
        let isDimmed = false;
        const screensaver = document.getElementById('screensaver');
        const weatherModal = document.getElementById('weather_modal');
        const musicModal = document.getElementById('music_modal');
        const audioPlayer = document.getElementById('audio_player');
        let weatherData = null;

        // --- CORE UI ---
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('saver_time').innerText = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('es-ES', options);
            document.getElementById('saver_date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }

        async function setBrightness(percent) {
            try { await fetch('http://localhost:5051/brightness', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ percent }) }); } catch (e) { console.error(e); }
        }

        function dismissScreensaver(event) {
            if (event && (event.target.closest('#weather_modal') || event.target.closest('#saver_weather') || event.target.closest('#music_modal'))) return;
            screensaver.classList.add('hidden');
            closeWeatherModal();
            idleTime = 0;
            if (isDimmed) { setBrightness(100); isDimmed = false; }
        }

        function activateScreensaver() {
            screensaver.classList.remove('hidden');
            fetchWeather();
            closeMusicModal();
            if (!isDimmed) { setBrightness(25); isDimmed = true; }
        }

        setInterval(() => {
            idleTime++;
            if (idleTime >= IDLE_LIMIT && screensaver.classList.contains('hidden')) activateScreensaver();
        }, 1000);
        document.body.addEventListener('click', (e) => { if (!e.target.closest('.modal')) idleTime = 0; });

        // --- TELEMETRY ---
        async function fetchNodeStats(id, url) {
            const statusEl = document.getElementById(`status_${id}`);
            const cpuEl = document.getElementById(`cpu_${id}`);
            const ramEl = document.getElementById(`ram_${id}`);
            const barCpu = document.getElementById(`bar_cpu_${id}`);
            const barRam = document.getElementById(`bar_ram_${id}`);

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 2000); // 2s timeout

                const res = await fetch(url, { signal: controller.signal });
                const data = await res.json();
                clearTimeout(timeoutId);

                // Update UI
                const cpu = Math.round(data.cpu);
                const ram = Math.round(data.ram);

                cpuEl.innerText = `${cpu}%`;
                ramEl.innerText = `${ram}%`;
                barCpu.style.width = `${cpu}%`;
                barRam.style.width = `${ram}%`;

                // Color Logic
                barCpu.style.background = cpu > 80 ? 'var(--danger)' : 'var(--accent)';
                barRam.style.background = ram > 80 ? 'var(--warning)' : 'var(--accent)';

                statusEl.className = 'node-status online';
            } catch (e) {
                statusEl.className = 'node-status offline';
                cpuEl.innerText = '--';
                ramEl.innerText = '--';
                barCpu.style.width = '0%';
                barRam.style.width = '0%';
            }
        }

        function updateAllNodes() {
            Object.keys(NODES).forEach(id => fetchNodeStats(id, NODES[id]));
        }

        // --- MUSIC ---
        const STATIONS = {
            noticias: [{ name: "RNE Radio 5 (ES)", url: "https://rne.rtveradio.cires21.com/rne_radio5_todo_noticias/mp3/icecast.audio" }, { name: "BBC World Service", url: "http://stream.live.vc.bbcmedia.co.uk/bbc_world_service" }, { name: "Cadena SER", url: "https://21253.live.streamtheworld.com/CADENASER.mp3" }],
            electronica: [{ name: "Ibiza Global Radio", url: "https://ibizaglobalradio.streaming-pro.com:8024/ibizaglobalradio.mp3" }, { name: "Sunshine Live", url: "https://sunshinelive.streamabc.net/sunshinelive-main-mp3-128-4435775" }, { name: "Tomorrowland", url: "https://28423.live.streamtheworld.com/OWR_INTERNATIONAL.mp3" }],
            rock: [{ name: "Radio Paradise Rock", url: "https://stream.radioparadise.com/rock-128" }, { name: "Rock FM (ES)", url: "https://flucast-b02-04.flumotion.com/cope/rockfm.mp3" }, { name: "Classic Rock Florida", url: "http://vip2.str3am.net:5020/stream" }],
            urbano: [{ name: "Los 40 Urban", url: "https://25263.live.streamtheworld.com/LOS40_URBAN_SC" }, { name: "Loca FM Urban", url: "http://audio-online.net:8200/urban" }],
            pop: [{ name: "Los 40 Principales", url: "https://20853.live.streamtheworld.com/LOS40.mp3" }, { name: "Europa FM", url: "https://icecast-streaming.atresmedia.com/europafm.mp3" }, { name: "Capital FM (UK)", url: "https://media-ice.musicradio.com/CapitalMP3" }],
            world: [{ name: "Radio 3 (ES)", url: "https://rne.rtveradio.cires21.com/rne_radio3/mp3/icecast.audio" }, { name: "KEXP (Seattle)", url: "https://kexp-mp3-128.streamguys1.com/kexp128.mp3" }, { name: "FIP (France)", url: "https://stream.radiofrance.fr/fip/fip.m3u8" }],
            ambient: [{ name: "SomaFM Drone Zone", url: "https://ice1.somafm.com/dronezone-128-mp3" }, { name: "Ambient Sleeping Pill", url: "http://uwstream1.somafm.com:8400" }],
            chill: [{ name: "Costa Del Mar", url: "https://radio.cdm-radio.com:8020/stream-mp3-Chillout" }, { name: "Chilltrax", url: "https://c3.houston1.radioservice.pro/8004/stream" }],
            lofi: [{ name: "Lofi Girl Radio", url: "http://play.sas-media.ru/play_256" }, { name: "Chillhop", url: "http://stream.zeno.fm/f3wvbbqmdg8uv" }]
        };

        const GENRE_ICONS = { noticias: '🌍', electronica: '⚡', rock: '🤘', urbano: '🎤', pop: '🎉', world: '🥁', ambient: '🌌', chill: '🐚', lofi: '☕' };

        // Init Music Grid
        const genreView = document.getElementById('genre_view');
        Object.keys(STATIONS).forEach(key => {
            const div = document.createElement('div');
            div.className = 'genre-card';
            div.innerHTML = `<div class="genre-icon">${GENRE_ICONS[key] || '🎵'}</div><div class="genre-name">${key}</div>`;
            div.onclick = () => showStations(key);
            genreView.appendChild(div);
        });

        function openMusicModal() { musicModal.classList.add('visible'); showGenres(); }
        function closeMusicModal() { musicModal.classList.remove('visible'); }
        function showGenres() { document.getElementById('genre_view').style.display = 'grid'; document.getElementById('station_view').style.display = 'none'; }

        function showStations(genre) {
            document.getElementById('genre_view').style.display = 'none';
            document.getElementById('station_view').style.display = 'flex';
            const cont = document.getElementById('stations_container');
            cont.innerHTML = '';
            (STATIONS[genre] || []).forEach(st => {
                const div = document.createElement('div');
                div.className = 'station-item';
                div.innerText = st.name;
                div.onclick = () => playStation(st.name, st.url);
                cont.appendChild(div);
            });
        }
        function playStation(name, url) {
            document.getElementById('np_name').innerText = name;
            audioPlayer.src = url;
            audioPlayer.play();
            document.getElementById('now_playing').classList.add('visible');
            document.getElementById('play_btn').innerText = '⏸';
        }
        function togglePlay() {
            if (audioPlayer.paused) { audioPlayer.play(); document.getElementById('play_btn').innerText = '⏸'; }
            else { audioPlayer.pause(); document.getElementById('play_btn').innerText = '▶'; }
        }
        function stopMusic() { audioPlayer.pause(); audioPlayer.src = ''; document.getElementById('now_playing').classList.remove('visible'); }

        // --- WEATHER ---
        function getWMOIcon(code, isDay) {
            if (code === 0) return isDay ? '☀️' : '🌙';
            if (code >= 1 && code <= 3) return isDay ? '⛅' : '☁️';
            if (code >= 45 && code <= 48) return '🌫️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 95 && code <= 99) return '⛈️';
            return '☁️';
        }

        async function fetchWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.3458&longitude=-3.8249&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FMadrid&forecast_days=1');
                weatherData = await res.json();
                const current = weatherData.current;
                document.getElementById('saver_temp').innerText = Math.round(current.temperature_2m) + '°C';
                document.getElementById('saver_icon').innerText = getWMOIcon(current.weather_code, current.is_day);
                document.getElementById('w_desc').innerText = "Forecast"; // Simplified
                document.getElementById('w_current').innerText = Math.round(current.temperature_2m) + '°';
                document.getElementById('w_hl').innerText = `↑ ${Math.round(weatherData.daily.temperature_2m_max[0])}° ↓ ${Math.round(weatherData.daily.temperature_2m_min[0])}°`;
                document.getElementById('w_rain').innerText = `☔ ${weatherData.daily.precipitation_probability_max[0]}%`;
            } catch (e) { console.error("Weather error:", e); }
        }
        function showWeatherModal(event) {
            if (event) event.stopPropagation();
            if (!weatherData) return;
            const strip = document.getElementById('hourly_strip');
            strip.innerHTML = '';
            const now = new Date();
            let count = 0;
            weatherData.hourly.time.forEach((t, i) => {
                if (count < 6 && new Date(t).getHours() >= now.getHours()) {
                    const slot = document.createElement('div');
                    slot.className = 'hourly-slot';
                    slot.innerHTML = `<span class="hourly-temp">${Math.round(weatherData.hourly.temperature_2m[i])}°</span><span class="hourly-icon">${getWMOIcon(weatherData.hourly.weather_code[i], weatherData.hourly.is_day[i])}</span><span class="hourly-time">${new Date(t).getHours()}:00</span>`;
                    strip.appendChild(slot);
                    count++;
                }
            });
            weatherModal.classList.add('visible');
        }
        function closeWeatherModal(event) { if (event) event.stopPropagation(); weatherModal.classList.remove('visible'); }

        // --- INIT ---
        setInterval(updateTime, 1000);
        setInterval(updateAllNodes, 2000); // Poll nodes every 2s
        setInterval(fetchWeather, 600000);

        updateTime();
        updateAllNodes();
        fetchWeather();
    </script>
</body>

</html>

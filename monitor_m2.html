<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M2 Touch Dashboard</title>
    <!-- Chart.js removed -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Playfair+Display:wght@700&display=swap');

        :root {
            --bg: #05070a;
            --panel: #0d1117;
            --accent: #00d4ff;
            --text: #e6edf3;
            --danger: #ff4444;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 1280px;
            height: 800px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(90deg);
            display: flex;
            flex-direction: column;
        }

        /* Screensaver styles */
        #screensaver {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        #screensaver.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #saver_time {
            font-size: 14rem;
            /* Masivo */
            font-weight: 700;
            color: #fff;
            margin: 0;
            line-height: 0.9;
        }

        #saver_date {
            font-size: 4rem;
            /* Mucho más grande */
            color: #888;
            margin-top: 20px;
            font-weight: 300;
            text-align: center;
        }

        #saver_weather {
            margin-top: 60px;
            display: flex;
            align-items: center;
            gap: 40px;
            cursor: pointer;
        }

        #saver_temp {
            font-size: 7rem;
            color: var(--accent);
            font-weight: 600;
        }

        #saver_icon {
            font-size: 7rem;
        }

        #saver_loc {
            font-size: 2rem;
            color: #555;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        /* Smart Weather Modal */
        #weather_modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            padding: 60px;
            box-sizing: border-box;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #weather_modal.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .weather-main {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: auto;
        }

        .weather-info h2 {
            font-size: 4rem;
            margin: 0;
            font-weight: 600;
        }

        .weather-meta {
            font-size: 2rem;
            margin-top: 20px;
            opacity: 0.9;
            display: flex;
            gap: 40px;
        }

        .weather-current-temp {
            font-size: 12rem;
            font-weight: 300;
            line-height: 1;
        }

        .hourly-container {
            display: flex;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
        }

        .hourly-slot {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .hourly-temp {
            font-size: 2.5rem;
            font-weight: 600;
        }

        .hourly-icon {
            font-size: 4rem;
        }

        .hourly-time {
            font-size: 1.5rem;
            opacity: 0.8;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(13, 17, 23, 0.8);
            border-bottom: 2px solid var(--accent);
        }

        .header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin: 0;
            color: var(--accent);
        }

        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: var(--panel);
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.98);
            background: #161b22;
        }

        .stat-value {
            font-size: 3.5rem;
            font-weight: 600;
            margin: 5px 0;
        }

        .stat-label {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1rem;
        }

        .footer {
            padding: 15px;
            text-align: center;
            background: #0d1117;
            border-top: 1px solid #30363d;
            font-size: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            background: var(--accent);
            color: #000;
            padding: 10px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-close {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 60px;
            height: 60px;
            font-size: 2rem;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2001;
        }

        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }
    </style>
</head>

<body>
    <!-- Screensaver Overlay -->
    <div id="screensaver" onclick="dismissScreensaver(event)">
        <div id="saver_time">--:--</div>
        <div id="saver_date">-- -- --</div>
        <div id="saver_weather" onclick="showWeatherModal(event)">
            <div id="saver_icon">🌤️</div>
            <div id="saver_temp">--°</div>
            <div style="font-size:1.5rem; color:#888;">(Detalles)</div>
        </div>
        <div id="saver_loc">Alcorcón, ES</div>
    </div>

    <!-- Smart Weather Modal -->
    <div id="weather_modal" onclick="closeWeatherModal(event)">
        <button class="btn-close" onclick="closeWeatherModal(event)">✕</button>

        <!-- Top Section -->
        <div class="weather-main">
            <div class="weather-info">
                <h2 id="w_desc">Cargando...</h2>
                <div class="weather-meta">
                    <span>Alcorcón</span>
                    <span id="w_hl">↑ --° ↓ --°</span>
                    <span id="w_rain">☔ --%</span>
                </div>
            </div>
            <div class="weather-current-temp" id="w_current">--°</div>
        </div>

        <!-- Hourly Forecast -->
        <div class="hourly-container" id="hourly_strip">
            <!-- Slots injected by JS -->
        </div>
    </div>

    <div class="header">
        <h1>ANTICITERA NEXUS M2</h1>
        <div id="clock" style="font-size: 2rem; font-weight: 600;"></div>
    </div>

    <div class="main">
        <div class="card" onclick="location.reload()">
            <div class="stat-label">⚡ CPU LOAD</div>
            <div class="stat-value" id="cpu_val">--%</div>
        </div>
        <div class="card">
            <div class="stat-label">🧠 RAM USAGE</div>
            <div class="stat-value" id="ram_val">--%</div>
        </div>
        <div class="card">
            <div class="stat-label">🛰️ REPLICATION</div>
            <div class="stat-value" id="sync_status" style="color: #0f0;">ONLINE</div>
        </div>
        <div class="card">
            <div class="stat-label">🦉 NODES STATUS</div>
            <div style="display: flex; gap: 20px; margin-top: 10px;">
                <div style="text-align:center;">
                    <div style="color:#0f0; font-size:1.5rem;">●</div> M2
                </div>
                <div style="text-align:center;">
                    <div id="hc1_dot" style="color:#0f0; font-size:1.5rem;">●</div> HC1
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="btn" onclick="fetchStats()">ACTUALIZAR</button>
        <button class="btn" style="background:#555; color:#fff;" onclick="activateScreensaver()">REPOSO</button>
    </div>

    <script>
        let idleTime = 0;
        const IDLE_LIMIT = 300;
        let isDimmed = false;
        const screensaver = document.getElementById('screensaver');
        const weatherModal = document.getElementById('weather_modal');

        let weatherData = null;

        async function setBrightness(percent) {
            try {
                await fetch('http://localhost:5051/brightness', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ percent })
                });
            } catch (e) { console.error(e); }
        }

        // Configurar interacción
        function dismissScreensaver(event) {
            // No cerrar si se clickea en el modal o el area del tiempo
            if (event && (event.target.closest('#weather_modal') || event.target.closest('#saver_weather'))) return;

            screensaver.classList.add('hidden');
            closeWeatherModal();
            idleTime = 0;
            if (isDimmed) {
                setBrightness(100);
                isDimmed = false;
            }
        }

        function activateScreensaver() {
            screensaver.classList.remove('hidden');
            fetchWeather();
            if (!isDimmed) {
                setBrightness(25);
                isDimmed = true;
            }
        }

        // Detector de inactividad
        setInterval(() => {
            idleTime++;
            if (idleTime >= IDLE_LIMIT) {
                if (screensaver.classList.contains('hidden')) {
                    activateScreensaver();
                }
            }
        }, 1000);

        document.body.addEventListener('click', (e) => {
            if (!e.target.closest('#weather_modal')) idleTime = 0;
        });

        // Reloj
        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('saver_time').innerText = now.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('es-ES', options);
            document.getElementById('saver_date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
        }

        // --- Weather Logic ---

        function getWMOIcon(code, isDay) {
            // Mapeo simple
            if (code === 0) return isDay ? '☀️' : '🌙';
            if (code >= 1 && code <= 3) return isDay ? '⛅' : '☁️';
            if (code >= 45 && code <= 48) return '🌫️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 95 && code <= 99) return '⛈️';
            return '☁️';
        }

        function getWMODesc(code) {
            const codes = {
                0: "Despejado", 1: "Mayormente despejado", 2: "Parcialmente nublado", 3: "Nublado",
                45: "Niebla", 48: "Niebla escarchada", 51: "Llovizna ligera", 53: "Llovizna moderada",
                55: "Llovizna intensa", 61: "Lluvia ligera", 63: "Lluvia moderada", 65: "Lluvia intensa",
                71: "Nieve ligera", 73: "Nieve moderada", 75: "Nieve intensa", 95: "Tormenta"
            };
            return codes[code] || "Desconocido";
        }

        async function fetchWeather() {
            try {
                // Fetch current + hourly + daily
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.3458&longitude=-3.8249&current=temperature_2m,weather_code,is_day&hourly=temperature_2m,weather_code,is_day&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FMadrid&forecast_days=1');
                weatherData = await res.json();

                const current = weatherData.current;

                // Update Screensaver
                document.getElementById('saver_temp').innerText = Math.round(current.temperature_2m) + '°C';
                document.getElementById('saver_icon').innerText = getWMOIcon(current.weather_code, current.is_day);

                // Update Modal Data
                document.getElementById('w_desc').innerText = getWMODesc(current.weather_code);
                document.getElementById('w_current').innerText = Math.round(current.temperature_2m) + '°';

                const daily = weatherData.daily;
                const max = Math.round(daily.temperature_2m_max[0]);
                const min = Math.round(daily.temperature_2m_min[0]);
                const rain = daily.precipitation_probability_max[0];

                document.getElementById('w_hl').innerText = `↑ ${max}° ↓ ${min}°`;
                document.getElementById('w_rain').innerText = `☔ ${rain}%`;

            } catch (e) {
                console.error("Weather error:", e);
            }
        }

        function showWeatherModal(event) {
            if (event) event.stopPropagation();
            if (!weatherData) return;

            // Build Hourly Strip
            const strip = document.getElementById('hourly_strip');
            strip.innerHTML = '';

            const hourly = weatherData.hourly;
            const now = new Date();
            const currentHour = now.getHours();

            // Show next 6 hours (skipping current if we want, but usually show current too)
            let count = 0;
            for (let i = 0; i < hourly.time.length; i++) {
                if (count >= 6) break;

                const timeStr = hourly.time[i]; // ISO string
                const date = new Date(timeStr);
                const hour = date.getHours();

                // Show from current hour onwards
                if (hour >= currentHour) {
                    const temp = Math.round(hourly.temperature_2m[i]);
                    const code = hourly.weather_code[i];
                    const isDay = hourly.is_day[i];

                    const slot = document.createElement('div');
                    slot.className = 'hourly-slot';
                    slot.innerHTML = `
                        <span class="hourly-temp">${temp}°</span>
                        <span class="hourly-icon">${getWMOIcon(code, isDay)}</span>
                        <span class="hourly-time">${hour === currentHour ? 'Ahora' : hour + ':00'}</span>
                    `;
                    strip.appendChild(slot);
                    count++;
                }
            }

            weatherModal.classList.add('visible');
        }

        function closeWeatherModal(event) {
            if (event) event.stopPropagation();
            weatherModal.classList.remove('visible');
        }

        async function fetchStats() {
            try {
                const response = await fetch('http://localhost:5051/stats');
                const data = await response.json();
                document.getElementById('cpu_val').innerText = Math.round(data.cpu) + '%';
                document.getElementById('ram_val').innerText = Math.round(data.ram) + '%';
                document.getElementById('cpu_val').style.color = 'var(--text)';
            } catch (e) {
                document.getElementById('cpu_val').style.color = 'var(--danger)';
            }
        }

        setInterval(updateTime, 1000);
        setInterval(fetchStats, 2000);
        setInterval(fetchWeather, 600000);

        updateTime();
        fetchStats();
        fetchWeather();
    </script>
</body>

</html>
